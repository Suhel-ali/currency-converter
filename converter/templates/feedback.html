{% extends "base.html" %}

{% block title %}
Feedback
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h2 class="text-center fw-bold mb-3">
                        Feedback
                    </h2>

                    <p class="text-center text-muted mb-4">
                        Tell us what you think about UrCurrency.
                    </p>


                    {% if error %}

                        <div class="alert alert-danger">
                            {{ error }}
                        </div>

                    {% endif %}


                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Your Feedback
                            </label>

                            <textarea
                                name="comment"
                                class="form-control"
                                rows="5"
                                placeholder="Write your feedback here..."
                                required
                            ></textarea>

                        </div>


                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Submit Feedback
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
