{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="container mt-3 mb-2">

    <div class="row justify-content-center  ">

        <div class="col-md-6">

            <div class="card bg-body-secondary ">

                <div class="card-body text-center">

                    <h3 class="ms-4 me-4 mb-3 fw-bold text-info-emphasis">
                       Hello, {{ user.username }}!
                    </h3>


                    <!-- Profile Image -->

                   <img
                        src="{{ profile.image.url }}"
                        alt="Profile Image"
                        width="180"
                        height="180"
                        class="rounded-circle object-fit-cover mb-3"
                    >
                                        

                    <p class="text-muted">
                        {{ user.email }}
                    </p>


                    <hr>


                    <!-- Upload Image -->

                    <h5 class="mb-3">
                        Change Profile Picture
                    </h5>

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}

                        <input
                            type="file"
                            name="image"
                            class="form-control mb-3"
                            accept="image/*"
                            required
                        >

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Upload Image
                        </button>

                    </form>
                    <hr class="my-4">

<a
    href="{% url 'logout' %}"
    class="btn btn-outline-danger"
>
    <i class="bi bi-box-arrow-right me-2"></i>
    Logout
</a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
