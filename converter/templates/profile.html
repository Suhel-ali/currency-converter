{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow-sm">

                <div class="card-body text-center">

                    <h3 class="mb-4">
                        My Profile
                    </h3>


                    <!-- Profile Image -->

                    <img
                        src="{{ profile.image.url }}"
                        alt="Profile Image"
                        width="150"
                        height="150"
                        class="rounded-circle mb-3"
                        style="object-fit: cover;"
                    >


                    <!-- User Information -->

                    <h4>
                        {{ user.username }}
                    </h4>

                    <p class="text-muted">
                        {{ user.email }}
                    </p>


                    <hr>


                    <!-- Upload Image -->

                    <h5 class="mb-3">
                        Change Profile Picture
                    </h5>

                    <form
                        method="POST"
                        enctype="multipart/form-data"
                    >

                        {% csrf_token %}

                        <input
                            type="file"
                            name="image"
                            class="form-control mb-3"
                            accept="image/*"
                            required
                        >

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Upload Image
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
