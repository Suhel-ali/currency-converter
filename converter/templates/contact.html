{% extends "base.html" %}

{% block title %}
Contact Us
{% endblock %}


{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7 col-lg-6">

            <div class="card shadow-sm">

                <div class="card-body p-4">


                    <!-- Heading -->

                    <div class="text-center mb-4">

                        <h2 class="fw-bold text-info-emphasis mb-2">
                            Contact Us
                        </h2>

                        <p class="text-muted">
                            Have a question or want to get in touch?
                        </p>

                    </div>


                    <!-- Email -->

                    <div class="d-flex align-items-center border rounded p-3 mb-3">

                        <i class="bi bi-envelope-fill fs-3 text-primary me-3"></i>

                        <div>

                            <h6 class="mb-1">
                               Email
                            </h6>

                            <a
                                href="mailto:Joyysohel@gmail.com"
                                class="text-decoration-none"
                            >
                                Joyysohel@gmail.com
                            </a>

                        </div>

                    </div>


                    <!-- Phone -->

                    <div class="d-flex align-items-center border rounded p-3 mb-3">

                        <i class="bi bi-telephone-fill fs-3 text-success me-3"></i>

                        <div>

                            <h6 class="mb-1">
                              Mobile
                            </h6>

                            <a
                                href="tel:+91897510096x"
                                class="text-decoration-none"
                            >
                                +91 8xx5100965
                            </a>

                        </div>

                    </div>


                    <!-- Instagram -->

                    <div class="d-flex align-items-center border rounded p-3 mb-3">

                        <i class="bi bi-instagram fs-3 text-danger me-3"></i>

                        <div>

                            <h6 class="mb-1">
                                Instagram
                            </h6>

                            <a
                                href="https://www.instagram.com/suhel.ali._"
                                target="_blank"
                                class="text-decoration-none"
                            >
                                @suhel.ali._
                            </a>

                        </div>

                    </div>


                    <!-- Location -->

                    <div class="d-flex align-items-center border rounded p-3">

                        <i class="bi bi-geo-alt-fill fs-3 text-warning me-3"></i>

                        <div>

                            <h6 class="mb-1">
                                Location
                            </h6>

                            <span class="text-muted">
                                Latur
                            </span>

                        </div>

                    </div>


                    <!-- Closing message -->

                    <p class="text-center text-muted mt-4 mb-0">

                        We would be happy to hear from you.

                    </p>


                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
